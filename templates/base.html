<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tailwindadmin - Modern Dashboard{% endblock %}</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecf2ff',
                            100: '#dce6ff',
                            200: '#bfd2fe',
                            300: '#94b4fc',
                            400: '#648cf8',
                            500: '#5D87FF',
                            600: '#4570ea',
                            700: '#3457c8',
                            800: '#2c469f',
                            900: '#283c7d',
                        },
                        sidebar: '#ffffff',
                        surface: '#f6f9fc',
                        darkText: '#2A3547',
                        mutedText: '#5A6A85',
                    }
                }
            }
        }
    </script>
    <!-- ApexCharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f9fc;
            color: #2A3547;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-[#F4F7FB] text-[#2A3547] min-h-screen antialiased flex flex-col">

    <!-- Global Flash Messages Notification Banner -->
    {% if messages %}
    <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full px-4" id="toast-container">
        {% for message in messages %}
        <div class="flex items-center p-4 rounded-xl shadow-lg border backdrop-blur-md transition-all duration-300 transform translate-y-0
            {% if message.tags == 'error' %}
                bg-rose-50/95 border-rose-200 text-rose-800
            {% elif message.tags == 'success' %}
                bg-emerald-50/95 border-emerald-200 text-emerald-800
            {% elif message.tags == 'warning' %}
                bg-amber-50/95 border-amber-200 text-amber-800
            {% else %}
                bg-blue-50/95 border-blue-200 text-blue-800
            {% endif %}"
            role="alert">
            <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg
                {% if message.tags == 'error' %} bg-rose-200/80 text-rose-700
                {% elif message.tags == 'success' %} bg-emerald-200/80 text-emerald-700
                {% elif message.tags == 'warning' %} bg-amber-200/80 text-amber-700
                {% else %} bg-blue-200/80 text-blue-700 {% endif %}">
                {% if message.tags == 'error' %}
                    <i class="fa-solid fa-triangle-exclamation"></i>
                {% elif message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info"></i>
                {% endif %}
            </div>
            <div class="ms-3 text-sm font-medium flex-1">{{ message }}</div>
            <button type="button" onclick="this.parentElement.remove()" class="ms-auto -mx-1.5 -my-1.5 rounded-lg p-1.5 inline-flex items-center justify-center h-8 w-8 text-gray-400 hover:text-gray-900 focus:ring-2 focus:ring-gray-300">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
        {% endfor %}
    </div>
    <script>
        setTimeout(() => {
            const container = document.getElementById('toast-container');
            if (container) {
                container.style.opacity = '0';
                setTimeout(() => container.remove(), 400);
            }
        }, 5000);
    </script>
    {% endif %}

    {% block content %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}
</body>
</html>
